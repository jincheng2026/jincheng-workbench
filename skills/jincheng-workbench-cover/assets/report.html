<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--ink:#21342c;--muted:#607168;--paper:#f4f3ec;--green:#1e654b;--line:#d7dfd4;--accent:#e3eb8d}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:80px}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif}a{color:var(--green);text-underline-offset:4px}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:8px 14px;background:#fff;color:var(--ink)}button:hover{border-color:var(--green)}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #61947c;outline-offset:3px}button[aria-pressed=true]{background:var(--green);color:white}header,main{max-width:1180px;margin:auto;padding:36px 28px}header{padding-top:64px}h1{font-size:clamp(30px,5vw,52px);line-height:1.2;max-width:940px;letter-spacing:-.035em}h2{font-size:28px;margin-top:52px}h3{font-size:21px;line-height:1.4}.eyebrow{letter-spacing:.12em;font-size:13px;color:var(--green)}.lead{font-size:20px;max-width:940px}.muted{color:var(--muted);font-size:14px}.status{border-left:4px solid var(--green);padding:12px 18px;background:#eaf0e6}.nav{position:sticky;top:0;z-index:2;display:flex;gap:22px;flex-wrap:wrap;padding:14px 28px;background:#f4f3ecf2;backdrop-filter:blur(12px);border-block:1px solid var(--line)}.nav a{text-decoration:none}.limit{background:#ebeae0;padding:16px 22px;border-radius:10px}.limit ul{padding-left:22px}.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.rule{border:1px solid var(--line);padding:22px;border-radius:12px;background:#fff}.rule h3{margin-top:0}.rule dl{margin-bottom:0}dt{font-size:13px;font-weight:700;color:var(--green);margin-top:14px}dd{margin:2px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.evidence{display:inline-block;border-bottom:1px solid #8eaa97;padding:1px 4px;margin-right:6px;text-decoration:none}summary{cursor:pointer;color:var(--green)}.search{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:22px}.search input{flex:1;min-width:180px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}.sample{display:grid;grid-template-columns:minmax(220px,.8fr) 1.2fr;gap:28px;border-top:1px solid var(--line);padding:30px 0;scroll-margin-top:80px}.sample[hidden]{display:none}.sample:target{background:#edf1d6;box-shadow:0 0 0 12px #edf1d6;border-radius:4px}.visual{align-self:start}.enlarge{display:block;border:0;border-radius:0;padding:0;background:transparent;width:100%}.enlarge img{display:block;width:100%;height:auto;max-height:650px;object-fit:contain;background:#e6e8df}.visual p{font-size:13px;color:var(--muted)}.inspection{background:#eeeee6;padding:12px;font-size:14px;border-radius:8px}.sample h3{margin-top:0}.bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:12px 20px;border-radius:12px;background:#183f30;color:white;z-index:3;box-shadow:0 8px 30px #0002;max-width:95vw}.bar[hidden]{display:none}.bar button{white-space:nowrap}.bar button:disabled{opacity:.5;cursor:not-allowed}.empty{text-align:center;padding:50px;color:var(--muted)}dialog{border:0;border-radius:12px;padding:18px;background:#f7f7f0;color:var(--ink);max-width:96vw;max-height:96vh;width:1150px}dialog::backdrop{background:#102018d9}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.frames{display:flex;gap:18px;justify-content:center;align-items:flex-start}.frames figure{margin:0;min-width:0;flex:1;text-align:center}.frames img{width:100%;height:auto;max-height:76vh;object-fit:contain}.frames figcaption{font-size:14px}.footer{padding:48px 0 110px;color:var(--muted);font-size:14px}@media(max-width:650px){header,main{padding:26px 18px}.nav{padding:10px 18px;gap:16px;font-size:14px}.rules{grid-template-columns:1fr}.sample{grid-template-columns:1fr;gap:18px}.enlarge img{max-height:560px}.bar{gap:8px;padding:10px;font-size:13px}.bar button{padding:6px 8px;font-size:13px}.frames{gap:8px}dialog{padding:10px}.lead{font-size:18px}}
</style>
</head>
<body>
<header><div class="eyebrow">封面视觉研究 · 原图与解释</div><h1>{{TITLE}}</h1><p class="lead">{{SUMMARY}}</p><p class="muted">{{SCOPE}}</p><p class="muted">{{SOURCE}}</p><p class="status">{{REVIEW}}</p></header>
<nav class="nav" aria-label="研究目录"><a href="#rules">视觉规则</a><a href="#cases">构图复用</a><a href="#samples">逐图观察</a><a href="VI规范.md">文字规范</a><a href="study.json">研究数据</a></nav>
<main>
<div class="limit"><strong>结论的适用范围</strong><ul>{{LIMITATIONS}}</ul></div>
<section id="rules"><h2>什么保持稳定，什么随内容变化</h2><div class="rules">{{RULES}}</div></section>
<section id="cases"><h2>怎样选参考并继续制作</h2><div class="rules">{{CASES}}</div></section>
<section id="samples"><h2>逐图观察与原图</h2><p class="muted">点击图片放大；选择两张可并排比较。图片按真实比例显示，保留来源字节。</p><div class="search"><label for="query">查找观察</label><input type="search" id="query" placeholder="输入编号、动作或文字"><button id="clear">清空</button><span id="count" aria-live="polite"></span></div><p class="empty" id="empty" hidden>没有找到匹配的观察。清空搜索后可查看全部图片。</p><div id="cards">{{CARDS}}</div></section>
<div class="footer">文件和统计检查不替代视觉事实复核。迁移验证与用户审美评审按本页标注的实际状态记录。</div>
</main>
<div class="bar" id="bar" hidden><span id="selection" aria-live="polite"></span><button id="compare" disabled>并排对比</button><button id="reset">取消选择</button></div>
<dialog id="viewer" aria-label="查看原图"><div class="dialoghead"><strong id="viewer-title">原图</strong><button id="close">关闭</button></div><div class="frames" id="frames"></div></dialog>
<script>
'use strict';
const q=document.getElementById('query'), cards=[...document.querySelectorAll('.sample')], count=document.getElementById('count'), empty=document.getElementById('empty');
function filter(){const term=q.value.toLocaleLowerCase().trim();let shown=0;cards.forEach(card=>{card.hidden=!card.dataset.search.toLocaleLowerCase().includes(term);if(!card.hidden)shown++});count.textContent=`${shown} / ${cards.length} 张`;empty.hidden=shown>0}
q.addEventListener('input',filter);document.getElementById('clear').onclick=()=>{q.value='';filter();q.focus()};filter();
document.querySelectorAll('.evidence').forEach(a=>a.addEventListener('click',()=>{q.value='';filter()}));
const viewer=document.getElementById('viewer'), frames=document.getElementById('frames');let origin=null;
function show(items){origin=document.activeElement;frames.replaceChildren();document.getElementById('viewer-title').textContent=items.length===2?'两图对比':'查看原图';items.forEach(item=>{const figure=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption');img.src=item.src;img.alt=item.id+' 原图';cap.textContent=item.id;figure.append(img,cap);frames.append(figure)});viewer.showModal()}
document.querySelectorAll('.enlarge').forEach(b=>b.onclick=()=>show([b.dataset]));document.getElementById('close').onclick=()=>viewer.close();viewer.addEventListener('close',()=>origin?.focus());viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});
const selected=new Map(), bar=document.getElementById('bar'), compare=document.getElementById('compare'), selection=document.getElementById('selection');
function update(){document.querySelectorAll('.compare').forEach(b=>{const has=selected.has(b.dataset.id);b.setAttribute('aria-pressed',String(has));b.textContent=has?'取消对比':'加入对比'});bar.hidden=selected.size===0;selection.textContent=`已选 ${selected.size} / 2：${[...selected.keys()].join('、')}`;compare.disabled=selected.size!==2}
document.querySelectorAll('.compare').forEach(b=>b.onclick=()=>{if(selected.has(b.dataset.id))selected.delete(b.dataset.id);else if(selected.size<2)selected.set(b.dataset.id,{id:b.dataset.id,src:b.dataset.src});else{selection.textContent='已选两张，请先取消其中一张';return}update()});compare.onclick=()=>show([...selected.values()]);document.getElementById('reset').onclick=()=>{selected.clear();update()};
</script>
</body>
</html>
